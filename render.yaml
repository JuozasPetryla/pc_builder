services:
  - type: web
    name: pc-builder
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]'
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: pc-admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
