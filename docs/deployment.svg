<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PC Builder numatoma UML diegimo diagrama</title>
  <desc id="desc">Naudotojo naršyklė jungiasi HTTPS ryšiu prie Render Docker konteinerio su React statiniais failais ir FastAPI. API TLS ryšiu jungiasi prie Neon PostgreSQL duomenų bazės.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.stereo{font-size:14px;font-style:italic;fill:#475569}.title{font-size:19px;font-weight:700}.subtitle{font-size:13px;fill:#475569}.outer{fill:#f1f5f9;stroke:#334155;stroke-width:2}.runtime{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.artifact{fill:#fff;stroke:#64748b;stroke-width:1.5}.path{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:15px;font-weight:700;fill:#0f766e}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <text x="600" y="38" text-anchor="middle" class="title">PC Builder – numatoma UML diegimo diagrama</text>

  <!-- Communication paths -->
  <path d="M270 305H375" class="path"/>
  <rect x="279" y="270" width="54" height="25" rx="4" fill="#fff"/>
  <text x="306" y="288" text-anchor="middle" class="label">HTTPS</text>
  <path d="M780 355H860V339H935" class="path"/>
  <rect x="810" y="303" width="115" height="37" rx="4" fill="#fff"/>
  <text x="867" y="319" text-anchor="middle" class="label" font-size="12">PostgreSQL</text>
  <text x="867" y="335" text-anchor="middle" class="label" font-size="12">per TLS</text>

  <!-- Client device -->
  <rect x="40" y="225" width="230" height="160" class="outer" filter="url(#shadow)"/>
  <text x="155" y="253" text-anchor="middle" class="stereo">«device»</text>
  <text x="155" y="278" text-anchor="middle" class="title">Naudotojo kompiuteris</text>
  <line x1="58" y1="290" x2="252" y2="290" stroke="#94a3b8"/>
  <rect x="76" y="310" width="158" height="52" class="artifact"/>
  <text x="155" y="331" text-anchor="middle" class="stereo">«artifact»</text>
  <text x="155" y="351" text-anchor="middle" font-size="15" font-weight="700">Naršyklė</text>

  <!-- Render node, single runtime container -->
  <rect x="340" y="70" width="500" height="480" class="outer" filter="url(#shadow)"/>
  <text x="590" y="99" text-anchor="middle" class="stereo">«node»</text>
  <text x="590" y="124" text-anchor="middle" class="title">Render Cloud</text>
  <text x="590" y="145" text-anchor="middle" class="subtitle">Frankfurt region</text>
  <rect x="375" y="175" width="430" height="330" class="runtime"/>
  <text x="590" y="205" text-anchor="middle" class="stereo">«executionEnvironment»</text>
  <text x="590" y="230" text-anchor="middle" class="title">Docker konteineris</text>
  <text x="590" y="252" text-anchor="middle" class="subtitle">Render Web Service: pc-builder</text>
  <rect x="400" y="300" width="175" height="110" class="artifact"/>
  <text x="487.5" y="326" text-anchor="middle" class="stereo">«artifact»</text>
  <text x="487.5" y="351" text-anchor="middle" font-size="16" font-weight="700">React dist/</text>
  <text x="487.5" y="377" text-anchor="middle" class="subtitle">Statinė sąsaja</text>
  <rect x="605" y="300" width="175" height="110" class="artifact"/>
  <text x="692.5" y="326" text-anchor="middle" class="stereo">«artifact»</text>
  <text x="692.5" y="351" text-anchor="middle" font-size="16" font-weight="700">FastAPI app/</text>
  <text x="692.5" y="377" text-anchor="middle" class="subtitle">REST API, SQLAlchemy</text>

  <!-- Managed database -->
  <rect x="910" y="210" width="250" height="190" class="outer" filter="url(#shadow)"/>
  <text x="1035" y="239" text-anchor="middle" class="stereo">«node»</text>
  <text x="1035" y="264" text-anchor="middle" class="title">Neon Cloud</text>
  <text x="1035" y="284" text-anchor="middle" class="subtitle">Valdoma DB paslauga</text>
  <rect x="935" y="300" width="200" height="78" class="artifact"/>
  <text x="1035" y="322" text-anchor="middle" class="stereo">«executionEnvironment»</text>
  <text x="1035" y="344" text-anchor="middle" font-size="15" font-weight="700">PostgreSQL 17</text>
  <text x="1035" y="364" text-anchor="middle" class="subtitle">«artifact» pc_builder DB</text>
</svg>
